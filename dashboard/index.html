<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SentinelFlow — Live Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d11;
    --panel: #12171d;
    --panel-2: #161c23;
    --line: #232a32;
    --text: #e6ecf1;
    --muted: #6f7d8a;
    --muted-2: #4a5560;
    --signal: #4fd1e8;
    --malicious: #e5484d;
    --suspicious: #f2a93b;
    --benign: #35c98c;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    background-attachment: fixed;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 28px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .brand .sub {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--benign);
    box-shadow: 0 0 0 0 rgba(53,201,140,0.6);
    animation: pulse 2s infinite;
  }
  .dot.down { background: var(--malicious); animation: none; box-shadow: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(53,201,140,0.55); }
    70% { box-shadow: 0 0 0 8px rgba(53,201,140,0); }
    100% { box-shadow: 0 0 0 0 rgba(53,201,140,0); }
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .metric {
    background: var(--panel);
    padding: 18px 16px;
    min-width: 0;
  }
  .metric .label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .metric .value {
    font-family: "IBM Plex Mono", monospace;
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
  }
  .metric .value.small { font-size: 20px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .panel-head h2 {
    font-size: 13px;
    font-weight: 600;
    margin: 0;
    color: var(--text);
  }
  .panel-head .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--muted);
  }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted-2);
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  .ioc { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; }
  .pill {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    padding: 3px 8px;
    border: 1px solid currentColor;
    border-radius: 2px;
  }
  .pill.malicious { color: var(--malicious); }
  .pill.suspicious { color: var(--suspicious); }
  .pill.benign { color: var(--benign); }
  .score { font-family: "IBM Plex Mono", monospace; color: var(--muted); }
  .status-text { color: var(--muted); font-size: 12.5px; }
  .timestamp { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--muted-2); white-space: nowrap; }

  .empty, .error {
    padding: 40px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
  .error { color: var(--malicious); }

  footer {
    margin-top: 24px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--muted-2);
    text-align: center;
  }

  @media (max-width: 720px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--line); padding: 12px 16px; }
    td { border: none; padding: 4px 0; display: flex; justify-content: space-between; gap: 12px; }
    td::before { content: attr(data-label); color: var(--muted-2); font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>SentinelFlow</h1>
        <span class="sub">// autonomous triage — live feed</span>
      </div>
      <div class="status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">connecting…</span>
      </div>
    </header>

    <div class="metrics" id="metrics">
      <div class="metric"><div class="label">Open</div><div class="value" id="mOpen">—</div></div>
      <div class="metric"><div class="label">Auto-resolved</div><div class="value" id="mAuto">—</div></div>
      <div class="metric"><div class="label">Total cases</div><div class="value" id="mTotal">—</div></div>
      <div class="metric"><div class="label">Mean time to resolve</div><div class="value small" id="mMttr">—</div></div>
      <div class="metric"><div class="label">Auto-resolution rate</div><div class="value" id="mRate">—</div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Recent activity</h2>
        <span class="count" id="rowCount"></span>
      </div>
      <div id="tableWrap">
        <div class="empty">Loading cases…</div>
      </div>
    </div>

    <footer id="lastUpdated"></footer>
  </div>

<script>
  // ── Configuration ────────────────────────────────────────────────
  // This key is visible to anyone viewing this page's source — acceptable
  // for a read-only portfolio demo, but a real production dashboard would
  // proxy these calls through a backend that holds the key server-side.
  const API_BASE = "https://sentinelflowai-production.up.railway.app";
  const API_KEY = "4f9d63cd9651c6aa8ad63589c3d2e11cc942be62ba5c1eb5ec6f02af71b9481d";
  const REFRESH_MS = 15000;
  // ─────────────────────────────────────────────────────────────────

  const $ = (id) => document.getElementById(id);

  function fmtMttr(seconds) {
    if (!seconds || seconds <= 0) return "—";
    const h = Math.floor(seconds / 3600);
    const m = Math.round((seconds % 3600) / 60);
    if (h === 0) return `${m}m`;
    return `${h}h ${m}m`;
  }

  function verdictPill(verdict) {
    const v = (verdict || "unknown").toLowerCase();
    const cls = ["malicious", "suspicious", "benign"].includes(v) ? v : "";
    return `<span class="pill ${cls}">${v}</span>`;
  }

  function fmtTime(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
    });
  }

  async function fetchJson(path) {
    const res = await fetch(`${API_BASE}${path}`, {
      headers: { "x-api-key": API_KEY }
    });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    return res.json();
  }

  async function loadMetrics() {
    const m = await fetchJson("/metrics");
    $("mOpen").textContent = m.openCases ?? "—";
    $("mAuto").textContent = m.autoResolvedCases ?? "—";
    $("mTotal").textContent = m.totalCases ?? "—";
    $("mMttr").textContent = fmtMttr(m.mttrSeconds);
    $("mRate").textContent = (m.autoResolutionRatePercent ?? 0) + "%";
  }

  async function loadCases() {
    const data = await fetchJson("/cases/recent?limit=10");
    const cases = data.cases || [];
    $("rowCount").textContent = `${cases.length} shown`;

    if (cases.length === 0) {
      $("tableWrap").innerHTML = `<div class="empty">No cases yet. Trigger a report to see activity here.</div>`;
      return;
    }

    const rows = cases.map(c => `
      <tr>
        <td data-label="IOC"><span class="ioc">${c.ioc}</span></td>
        <td data-label="Verdict">${verdictPill(c.verdict)}</td>
        <td data-label="Score"><span class="score">${c.risk_score ?? "—"}</span></td>
        <td data-label="Status"><span class="status-text">${c.status}</span></td>
        <td data-label="Source"><span class="status-text">${c.source || "—"}</span></td>
        <td data-label="Reported"><span class="timestamp">${fmtTime(c.created_at)}</span></td>
      </tr>
    `).join("");

    $("tableWrap").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>IOC</th><th>Verdict</th><th>Score</th><th>Status</th><th>Source</th><th>Reported</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  async function refresh() {
    try {
      await Promise.all([loadMetrics(), loadCases()]);
      $("statusDot").classList.remove("down");
      $("statusText").textContent = "live";
      $("lastUpdated").textContent = `Last updated ${new Date().toLocaleTimeString()}`;
    } catch (err) {
      $("statusDot").classList.add("down");
      $("statusText").textContent = "connection error";
      $("tableWrap").innerHTML = `<div class="error">Could not reach the API — ${err.message}</div>`;
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
